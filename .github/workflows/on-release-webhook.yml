# ============================================================================
# Webhook Trigger for Changelog Updates
# ============================================================================
#
# Appends release content to the current month's changelog file.
#
# To enable in Hyperscape repo, add to release workflow:
#
#    - name: Trigger docs changelog
#      uses: peter-evans/repository-dispatch@v3
#      with:
#        token: ${{ secrets.DOCS_REPO_TOKEN }}
#        repository: HyperscapeAI/docs
#        event-type: release-published
#        client-payload: |
#          {
#            "release_name": "${{ github.event.release.name }}",
#            "release_tag": "${{ github.event.release.tag_name }}",
#            "release_body": "${{ github.event.release.body }}",
#            "release_date": "${{ github.event.release.published_at }}"
#          }
#
# ============================================================================

name: On Release Webhook

on:
  repository_dispatch:
    types: [release-published]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Log trigger
        run: |
          echo "🚀 Release webhook received!"
          echo "   Name: ${{ github.event.client_payload.release_name }}"
          echo "   Tag: ${{ github.event.client_payload.release_tag }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Add to monthly changelog
        run: |
          NAME="${{ github.event.client_payload.release_name }}"
          TAG="${{ github.event.client_payload.release_tag }}"
          BODY="${{ github.event.client_payload.release_body }}"
          DATE="${{ github.event.client_payload.release_date }}"
          
          # Use tag as name if empty
          [ -z "$NAME" ] || [ "$NAME" = "null" ] && NAME="$TAG"
          
          # Parse date
          YEAR=$(echo "$DATE" | cut -d'-' -f1)
          MONTH=$(echo "$DATE" | cut -d'-' -f2)
          DAY=$(echo "$DATE" | cut -d'T' -f1 | cut -d'-' -f3)
          
          FILEPATH="changelog/$YEAR-$MONTH.mdx"
          
          # Create file if needed
          if [ ! -f "$FILEPATH" ]; then
            MONTH_NAME=$(date -d "$YEAR-$MONTH-01" "+%B" 2>/dev/null || echo "Month $MONTH")
            cat > "$FILEPATH" << EOF
          ---
          title: "$MONTH_NAME $YEAR"
          description: "Updates and releases for $MONTH_NAME $YEAR"
          ---
          EOF
          fi
          
          # Append release
          cat >> "$FILEPATH" << EOF

          ## $NAME ($TAG)

          *Released: $YEAR-$MONTH-$DAY*

          $BODY

          ---
          EOF
          
          echo "✅ Added to $FILEPATH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(changelog): add ${{ github.event.client_payload.release_tag }}"
          title: "📝 Changelog: ${{ github.event.client_payload.release_name }}"
          body: |
            Added release **${{ github.event.client_payload.release_tag }}** to changelog.
            
            Review and merge when ready.
          branch: auto/changelog-${{ github.event.client_payload.release_tag }}
          delete-branch: true
          labels: |
            documentation
            automated
