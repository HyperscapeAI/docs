# ============================================================================
# Automatic Changelog Sync from Hyperscape Releases
# ============================================================================
#
# This workflow runs in the DOCS repo and fetches releases from the 
# Hyperscape repo, then updates the changelog.mdx file.
#
# Triggers:
#   - Daily at midnight UTC (cron)
#   - Manual trigger (workflow_dispatch)
#   - When pushed to main (to catch manual edits)
#
# No PAT required for public repos - uses built-in GITHUB_TOKEN
# ============================================================================

name: Sync Changelog

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  
  # Manual trigger
  workflow_dispatch:
  
  # Also run on push to catch any issues
  push:
    branches:
      - main
    paths:
      - "scripts/sync-changelog.ts"
      - ".github/workflows/sync-changelog.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync changelog from GitHub releases
        run: bun run scripts/sync-changelog.ts
        env:
          # Using default GITHUB_TOKEN - works for public repos
          # For private repos, add a PAT as GITHUB_TOKEN secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet changelog.mdx; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📝 No changelog updates needed"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changelog has updates"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: sync changelog from GitHub releases"
          title: "📝 Sync Changelog from GitHub Releases"
          body: |
            ## Automatic Changelog Sync
            
            This PR updates the changelog with the latest releases from [HyperscapeAI/hyperscape](https://github.com/HyperscapeAI/hyperscape/releases).
            
            ---
            
            _This PR was automatically generated by the [sync-changelog](.github/workflows/sync-changelog.yml) workflow._
          branch: auto/sync-changelog
          delete-branch: true
          labels: |
            documentation
            automated

      # Alternative: Direct commit (uncomment if you prefer auto-merge)
      # - name: Commit and push
      #   if: steps.changes.outputs.changed == 'true'
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add changelog.mdx
      #     git commit -m "docs: sync changelog from GitHub releases"
      #     git push
