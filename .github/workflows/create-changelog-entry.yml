# ============================================================================
# Lightweight Changelog Entry Creator
# ============================================================================
#
# Creates a new changelog entry when a release is published or manually triggered.
# Uses a simple template-based approach - no external dependencies.
#
# Triggers:
#   - When a release is published in hyperscape repo (via webhook)
#   - Manual trigger with custom content
#
# ============================================================================

name: Create Changelog Entry

on:
  # Triggered by on-release-webhook.yml when a release is published
  repository_dispatch:
    types: [release-published]
  
  # Manual trigger for custom entries
  workflow_dispatch:
    inputs:
      title:
        description: 'Entry title (e.g., "Combat Improvements")'
        required: true
        type: string
      date:
        description: 'Date (YYYY-MM-DD format)'
        required: true
        type: string
      description:
        description: 'Short description for the entry'
        required: true
        type: string
      content:
        description: 'Markdown content for the changelog entry'
        required: true
        type: string

jobs:
  create-entry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

      - name: Parse release data (from webhook)
        if: github.event_name == 'repository_dispatch'
        id: release
        run: |
          # Extract release data from payload
          RELEASE_NAME="${{ github.event.client_payload.release_name }}"
          RELEASE_TAG="${{ github.event.client_payload.release_tag }}"
          RELEASE_BODY="${{ github.event.client_payload.release_body }}"
          RELEASE_DATE="${{ github.event.client_payload.release_date }}"
          
          # Generate filename from date and title
          DATE_PREFIX=$(echo "$RELEASE_DATE" | cut -d'T' -f1 | sed 's/-//g' | cut -c5-8)
          SLUG=$(echo "$RELEASE_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-30)
          YEAR=$(echo "$RELEASE_DATE" | cut -d'-' -f1)
          MONTH_DAY=$(echo "$RELEASE_DATE" | cut -d'T' -f1 | cut -d'-' -f2-3 | tr '-' '-')
          
          echo "title=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "filename=$MONTH_DAY-$SLUG" >> $GITHUB_OUTPUT
          
          # Save body to file for multiline handling
          echo "$RELEASE_BODY" > /tmp/release_body.md

      - name: Parse manual input
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          DATE="${{ github.event.inputs.date }}"
          TITLE="${{ github.event.inputs.title }}"
          
          YEAR=$(echo "$DATE" | cut -d'-' -f1)
          MONTH_DAY=$(echo "$DATE" | cut -d'-' -f2-3)
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-30)
          
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "filename=$MONTH_DAY-$SLUG" >> $GITHUB_OUTPUT
          echo "description=${{ github.event.inputs.description }}" >> $GITHUB_OUTPUT
          
          # Save content to file
          cat << 'CONTENT_EOF' > /tmp/release_body.md
          ${{ github.event.inputs.content }}
          CONTENT_EOF

      - name: Ensure year directory exists
        run: |
          YEAR="${{ steps.release.outputs.year || steps.manual.outputs.year }}"
          mkdir -p "changelog/$YEAR"

      - name: Create changelog entry file
        run: |
          YEAR="${{ steps.release.outputs.year || steps.manual.outputs.year }}"
          FILENAME="${{ steps.release.outputs.filename || steps.manual.outputs.filename }}"
          TITLE="${{ steps.release.outputs.title || steps.manual.outputs.title }}"
          DATE="${{ steps.release.outputs.date || steps.manual.outputs.date }}"
          DESCRIPTION="${{ steps.manual.outputs.description || 'Release notes' }}"
          
          FILEPATH="changelog/$YEAR/$FILENAME.mdx"
          
          # Format date for display
          DISPLAY_DATE=$(date -d "$DATE" "+%B %d, %Y" 2>/dev/null || echo "$DATE")
          
          # Create the changelog entry
          cat > "$FILEPATH" << ENTRY_EOF
          ---
          title: "$TITLE"
          description: "$DISPLAY_DATE - $DESCRIPTION"
          ---
          
          $(cat /tmp/release_body.md)
          ENTRY_EOF
          
          echo "Created: $FILEPATH"
          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT

      - name: Update changelog index
        run: |
          # This is a placeholder - in production, you'd want to update the index
          # For now, manual updates to changelog/index.mdx are recommended
          echo "Remember to update changelog/index.mdx with the new entry"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(changelog): add entry for ${{ steps.release.outputs.title || steps.manual.outputs.title }}"
          title: "📝 Changelog: ${{ steps.release.outputs.title || steps.manual.outputs.title }}"
          body: |
            ## New Changelog Entry
            
            This PR adds a changelog entry for: **${{ steps.release.outputs.title || steps.manual.outputs.title }}**
            
            ### Checklist
            - [ ] Review the generated content
            - [ ] Update `changelog/index.mdx` to include the new entry
            - [ ] Verify formatting looks correct
            
            ---
            
            _This PR was automatically generated._
          branch: auto/changelog-${{ steps.release.outputs.filename || steps.manual.outputs.filename }}
          delete-branch: true
          labels: |
            documentation
            changelog
            automated
