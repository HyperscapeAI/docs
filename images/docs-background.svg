<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- True warm black vignette -->
    <radialGradient id="darkVignette" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#161619" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0D0D0F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D0D0F" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Subtle Old Gold accent in corner -->
    <radialGradient id="goldAccent" cx="85%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1C1C21" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Base obsidian background -->
  <rect width="100%" height="100%" fill="#0D0D0F"/>
  
  <!-- Subtle vignette -->
  <rect width="100%" height="100%" fill="url(#darkVignette)"/>
  
  <!-- Very subtle grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Gold accent glow -->
  <rect width="100%" height="100%" fill="url(#goldAccent)"/>
  
  <!-- Decorative corner accents with Old Gold -->
  <path d="M 0 80 Q 40 40 80 0 L 0 0 Z" fill="#D4AF37" opacity="0.015"/>
  <path d="M 1920 1000 Q 1880 1040 1840 1080 L 1920 1080 Z" fill="#D4AF37" opacity="0.015"/>
</svg>
